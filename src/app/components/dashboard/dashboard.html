@if (isLoading()) {
  <div class="loading">Loading...</div>
} @else if (error()) {
  <div class="error">{{ error() }}</div>
} @else {
  <div class="dashboard">
    <h1>Dashboard</h1>
    <div>
      <app-distribution-chart
        title="Foods"
        [data]="foodStats().foodStats"
      ></app-distribution-chart>
    </div>
  </div>
}
