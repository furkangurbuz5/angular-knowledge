@if (isLoading()) {
  <div class="loading">Loading...</div>
} @else if (error()) {
  <div class="error">{{ error() }}</div>
} @else {
  <div class="dashboard">
    <h1>Dashboard</h1>

    <div class="stats-summary">
      <app-stats-card
        title="Total Persons"
        [value]="personStats().totalPersons"
        subtitle="Total count of persons" />

      <app-stats-card
        title="Honda Users"
        [value]="getPercentageByLabel(personStats().carStats, 'Honda')"
        subtitle="% of persons driving a Honda" />

      <app-stats-card
        title="From Netherlands"
        [value]="getPercentageByLabel(personStats().countryStats, 'Netherlands')"
        subtitle="% of persons from Netherlands" />

      <app-stats-card
        title="Unique Cities"
        [value]="personStats().cityStats.length"
        subtitle="Number of unique cities" />
    </div>

    <div class="charts-row">
      <app-distribution-chart
        title="Car Distribution"
        [data]="personStats().carStats" />

      <app-distribution-chart
        title="Country Distribution"
        [data]="personStats().countryStats" />
    </div>

    <div class="charts-row">
      <app-distribution-chart
        title="Bank Distribution"
        [data]="personStats().bankStats" />

      <app-distribution-chart
        title="City Distribution"
        [data]="personStats().cityStats" />
    </div>

    <div>
      <app-distribution-chart
        title="Foods"
        [data]="foodStats().foodStats"
      ></app-distribution-chart>
    </div>
  </div>
}
