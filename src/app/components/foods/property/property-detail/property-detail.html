
@if (isLoading()) {
  <div class="loading-spinner">Loading...</div>
} @else if (hasError()) {
  <div class="error-message">{{ errorMessage() }}</div>
} @else if (property()) {
  <div class="property-detail-container">
    <app-property-card
    [property]="property()!"
    >

    </app-property-card>
    <app-action
      [item]="property()"
      (onBack)="onBack()"
    ></app-action>
  </div>
}
