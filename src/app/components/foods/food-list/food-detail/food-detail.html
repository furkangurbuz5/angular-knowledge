@if (isLoading()) {
  <div class="loading-spinner">Loading...</div>
} @else if (hasError()) {
  <div class="error-message">{{ errorMessage() }}</div>
} @else if (food()) {
  <div class="food-detail-container">
    <app-food-card
      [food]="food()!"
    >
    </app-food-card>
    <app-action
      [item]="food()"
      (onBack)="onBack()"
      (onDelete)="onDelete($event!)"
    ></app-action>

    <h2>Properties</h2>
    <div class="food-property-card-container">
    @for (foodProperty of foodProperties(); track foodProperty.id) {
      <app-food-property-card [property]="foodProperty"></app-food-property-card>
    }
    </div>




  </div>
}
