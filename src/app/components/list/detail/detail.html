
@if (isLoading()) {
  <div class="loading-spinner">Loading...</div>
} @else if (hasError()) {
  <div class="error-message">{{ errorMessage() }}</div>
} @else if (person()) {
  <div class="person-detail-container">
    <app-card [person]="person()!" />
    <app-action
      [person]="person()!"
      (onBack)="onBack()"
      (onDelete)="onDelete($event)"
    />
  </div>
}
