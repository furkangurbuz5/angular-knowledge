<div class="property-card">
  <header class="person-card-header">
    <h2>{{ person().firstName }} {{ person().lastName }}</h2>
  </header>
  <div class="person-card-body">
    <div class="person-field">
      <span class="field-label">ID:</span>
      <span class="field-value">{{ person().id }}</span>
    </div>
    <div class="person-field">
      <span class="field-label">Email:</span>
      <span class="field-value">{{ person().email }}</span>
    </div>
    <div class="person-field">
      <span class="field-label">Car:</span>
      <span class="field-value">{{ person().car }}</span>
    </div>
    <div class="person-field">
      <span class="field-label">City:</span>
      <span class="field-value">{{ person().city }}</span>
    </div>
    <div class="person-field">
      <span class="field-label">Country:</span>
      <span class="field-value">{{ person().countryOfOrigin }}</span>
    </div>
    <div class="person-field">
      <span class="field-label">Bank:</span>
      <span class="field-value">{{ person().bank }}</span>
    </div>
  </div>
</div>
