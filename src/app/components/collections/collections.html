<div class="collection-container">
  <h2>Add a Collection</h2>

  @if (collections().length > 0) {
    <div class="collection-list">
      @for (collection of collections(); track collection.id) {
        <div class="collection-item">
          <a [routerLink]="['/collection', collection.id]" class="collection-link">
            {{ collection.name }}
          </a>
        </div>
      }
    </div>
  } @else {
    <p class="no-collections">No collections added yet.</p>
  }

  <form class="collection-form" (ngSubmit)="addCollection()">
    <div class="form-field">
      <label for="add_collection">Collection</label>
      <input
        id="add_collection"
        type="text"
        [(ngModel)]="collection"
        name="collection"
        placeholder="Enter collection name"
      />
    </div>

    <div class="form-actions">
      <button type="submit" class="button primary">Add Collection</button>
    </div>
  </form>
</div>
