<div class="food-card">
  <div class="food-card-body">
    <div class="food-field">
      <span class="field-label">Name:</span>
      <span class="field-value">{{ food().name }}</span>
    </div>
    <div class="food-field">
      <span class="field-label">Serving size:</span>
      <span class="field-value">{{ food().servingSize }}</span>
    </div>
    <div class="food-field">
      <span class="field-label">Unit:</span>
      <span class="field-value">{{ food().unit }}</span>
    </div>
    <div class="food-field">
      <span class="field-label">Quantity:</span>
      <span class="field-value">{{ food().quantity }}</span>
    </div>
  </div>
</div>
