<button (click)="onAddMeal()">Add meal</button>

@if (meals().length > 0) {
  @for (meal of meals(); track meal.id) {
    <h4>
      <a [routerLink]="['/meal', meal.id]">Meal {{ $index + 1 }} ({{ getMealTime(meal) }}) </a>
    </h4>
    <button (click)="onDelete(meal.id)">Delete meal</button>

    @if (!$last) {
      <hr />
    }
  }
}
