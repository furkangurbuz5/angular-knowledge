@if (!isLoading()) {
  <h4>Meal at {{ getMealTime(meal()) }}</h4>

  <select [(ngModel)]="dishId" (change)="getDish(dishId)">
    <option [ngValue]="0">Select a dish..</option>
    @for (dish of dishes(); track dish.id) {
      <option [value]="dish.id">{{ dish.name }}</option>
    }
  </select>

  @if (dishWithFoods()) {
    <app-meal-table
      [dish]="dishWithFoods()"
      [foods]="foods()"
      (update)="updateFoodInDish($event.dishId, $event.foodId, $event.event)"
      (delete)="onDeleteFoodFromDish($event.dishId, $event.foodId)"
      (add)="addFoodToDish($event.dishId, $event.foodId)"
    ></app-meal-table>
  }

  <h5>Summary</h5>

  <table>
    <thead>
      <tr>
        <th>Property</th>
        <th>Amount</th>
        <th>Unit</th>
      </tr>
    </thead>

    <tbody>
      @for (property of dishWithFoods().dishProperties; track property.propertyId) {
        <tr>
          <td>{{ property.propertyName }}</td>
          <td>{{ property.propertyAmount }}</td>
          <td>{{ property.unit }}</td>
        </tr>
      }
    </tbody>
  </table>

  <button (click)="onAddDishToMeal()">Add Dish</button>
}
