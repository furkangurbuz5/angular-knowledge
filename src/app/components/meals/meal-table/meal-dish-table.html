<h6>{{ mealDish().name }}</h6>

<table>
  <thead>
  <tr>
    <th>Food</th>
    <th>Quantity</th>
    <th>Serving size</th>
    <th>Per (unit)</th>
  </tr>
  </thead>

  <tbody>
    @for (ingredient of mealDish().ingredients; track ingredient.id) {
      <tr>
        <td>{{ ingredient.name }}</td>
        <td>
          <input
            type="number"
            [value]="ingredient.quantity"
            (change)="updateIngredient(mealDish().id, ingredient.ingredientId, $event)"
          />
        </td>
        <td>{{ ingredient.servingSize }}</td>
        <td>{{ mapUnitIdToOption(ingredient.unitId) }}</td>
        <td>
          <button (click)="deleteIngredient(mealDish().id, ingredient.ingredientId)">Delete</button>
        </td>
      </tr>
    }
  </tbody>
</table>

<select [(ngModel)]="foodId">
  <option [ngValue]="0">Add a food...</option>
  @for (food of foods(); track $index) {
    <option [ngValue]="food.id">{{ food.name }}</option>
  }
</select>
<button (click)="addIngredient(mealDish().id, foodId)">Add</button>
